[package]
name = "cooldown-adapters"
description = "Cooldown source adapters: Claude Code inbox, Codex app-server and rollout logs, OpenRouter, DeepSeek and xAI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cooldown-core = { path = "../cooldown-core" }
async-trait = "0.1"
dirs = { workspace = true }
keyring = "4"
# rustls only, no default features: no OpenSSL, no HTTP/2, no cookies, no redirects other than our own policy.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
httpmock = "0.8"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
