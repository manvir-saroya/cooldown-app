[package]
name = "cooldown-desktop"
description = "Cooldown desktop app (Tauri 2): tray, adapters, reset alerts and phone pairing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
default-run = "cooldown-desktop"

[lib]
name = "cooldown_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "cooldown-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cooldown-core = { path = "../../../crates/cooldown-core" }
cooldown-adapters = { path = "../../../crates/cooldown-adapters" }
cooldown-statusline = { path = "../../../crates/cooldown-statusline" }
cooldown-sync = { path = "../../../crates/cooldown-sync" }

tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-single-instance = "2.5"

async-trait = "0.1"
if-addrs = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# API keys: keyring-core plus the native stores directly (not the keyring wrapper), so Windows
# credentials can be pinned to this machine. Same versions as cooldown-sync.
keyring-core = "1"
tauri-plugin-log = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[dev-dependencies]
tempfile = { workspace = true }
