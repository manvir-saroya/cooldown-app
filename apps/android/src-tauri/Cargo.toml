[package]
name = "cooldown-android"
description = "Cooldown Android app (Tauri 2 mobile): LAN pairing and sync as the phone, exact alarms, Glance widget"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "cooldown_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cooldown-core = { path = "../../../crates/cooldown-core" }
# No OS keychain on Android: the phone identity is supplied by the app (see phone.rs).
cooldown-sync = { path = "../../../crates/cooldown-sync", default-features = false }

tauri = { version = "2.12", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zeroize = { version = "1", features = ["serde"] }
base64 = "0.22"
if-addrs = "0.15"
# The door the background sync worker (Kotlin) calls into: src/jni_entry.rs. Already in the tree
# through Tauri, same version.
jni = "0.21"
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
